name: luchii
description: "ЛучII — передача файлов через QR без интернета"
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.1
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  file_picker: ^8.1.2
  path_provider: ^2.1.5
  network_info_plus: ^6.1.0
  encrypt: ^5.0.3
  share_plus: ^10.1.4
  open_filex: ^4.6.0
  url_launcher: ^6.3.1
  intl: ^0.19.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/
    - assets/apps/
